name: Production dependency audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - config/playwright-mcp/package.json
      - config/playwright-mcp/pnpm-lock.yaml
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - package.json
      - pnpm-lock.yaml
      - config/playwright-mcp/package.json
      - config/playwright-mcp/pnpm-lock.yaml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            config/playwright-mcp/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir config/playwright-mcp install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: |
          pnpm audit --prod
          pnpm --dir config/playwright-mcp audit --prod
