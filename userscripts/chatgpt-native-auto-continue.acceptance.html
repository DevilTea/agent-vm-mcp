<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ChatGPT Native Auto Continue Acceptance</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; }
    #prompt-textarea { display: block; min-width: 240px; min-height: 24px; border: 1px solid; }
    button { min-width: 80px; min-height: 24px; margin: 2px; }
    [data-message-author-role="user"] { min-width: 100px; min-height: 20px; }
    .hidden { display: none !important; }
    #result { white-space: pre-wrap; }
  </style>
</head>
<body>
  <form id="composer-form">
    <div id="prompt-textarea" contenteditable="true"></div>
    <button type="button" data-testid="send-button">Send</button>
  </form>
  <main id="turns">
    <div data-testid="conversation-turn-1">
      <div data-message-author-role="user" data-message-id="user-1">Initial prompt</div>
    </div>
  </main>
  <pre id="result">running…</pre>

  <script>
    history.replaceState({}, '', '/c/chat-a');
    localStorage.clear();
    sessionStorage.clear();
    window.__testClicks = [];
  </script>
  <script>
    ;(async function () {
      const CONTROLLER_KEY = '__devilteaChatGPTNativeAutoContinue';
      const STORAGE_PREFIX = 'deviltea.chatgpt-native-auto-continue.v1:';
      const RUNTIME_PREFIX = 'deviltea.chatgpt-native-auto-continue.runtime.v1:';
      const CLICKED_ATTRIBUTE = 'data-deviltea-native-auto-continue-clicked';
      const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
      const results = {};
      const resultNode = document.getElementById('result');
      const fixtureNativePushState = history.pushState;

      function status() {
        return window[CONTROLLER_KEY]?.status;
      }

      function clicks(id) {
        return window.__testClicks.filter(value => value === id).length;
      }

      function setComposer(text) {
        const composer = document.querySelector('#prompt-textarea');
        if (composer instanceof HTMLTextAreaElement || composer instanceof HTMLInputElement) {
          composer.value = text;
        } else if (composer) {
          composer.textContent = text;
        }
        composer?.dispatchEvent(new InputEvent('input', { bubbles: true, data: text }));
      }

      function addButton(label, id, { ariaLabel, testId, clicked = false } = {}) {
        const button = document.createElement('button');
        button.type = 'button';
        button.id = id;
        button.textContent = label;
        if (ariaLabel) button.setAttribute('aria-label', ariaLabel);
        if (testId) button.setAttribute('data-testid', testId);
        if (clicked) button.setAttribute(CLICKED_ATTRIBUTE, '1');
        button.addEventListener('click', () => window.__testClicks.push(id));
        document.getElementById('turns').append(button);
        return button;
      }

      function remove(id) {
        document.getElementById(id)?.remove();
      }

      function addUserMessage(id, text) {
        const turn = document.createElement('div');
        turn.setAttribute('data-testid', `conversation-turn-${id}`);
        const message = document.createElement('div');
        message.setAttribute('data-message-author-role', 'user');
        message.setAttribute('data-message-id', `user-${id}`);
        message.textContent = text;
        turn.append(message);
        document.getElementById('turns').append(turn);
        return turn;
      }

      function runtimeKey(conversationId) {
        return `${RUNTIME_PREFIX}${conversationId}`;
      }

      function enabledKey(conversationId) {
        return `${STORAGE_PREFIX}${conversationId}`;
      }

      async function loadController() {
        window[CONTROLLER_KEY]?.destroy?.();
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = `/chatgpt-native-auto-continue.user.js?fixture=${Date.now()}-${Math.random()}`;
          script.onload = () => {
            script.remove();
            resolve();
          };
          script.onerror = reject;
          document.head.append(script);
        });
      }

      try {
        await loadController();

        // Disabled by default: native controls must never click before per-chat opt-in.
        addButton('Continue generating', 'disabled-default');
        await wait(1_000);
        results.initialDisabledNoClick = clicks('disabled-default') === 0 && status().enabled === false;
        remove('disabled-default');

        window[CONTROLLER_KEY].enable();

        // Core: explicit native control auto-clicks once.
        addButton('Continue generating', 'native-1');
        await wait(1_050);
        results.enabledNativeClicksOnce = clicks('native-1') === 1 && status().chainCount === 1;

        // Re-evaluation keeps the same consumed DOM node once-only.
        await loadController();
        await wait(1_000);
        results.reEvaluationDoesNotReclick = clicks('native-1') === 1 && status().chainCount === 1;

        // A consumed old control must not create ambiguity for a new one.
        addButton('Continue generating', 'native-2');
        await wait(1_050);
        results.consumedOldControlExcluded = clicks('native-2') === 1 && status().chainCount === 2;
        remove('native-1');
        remove('native-2');

        // Generic Continue is never guessed as native cut-off continuation.
        addButton('Continue', 'generic-continue');
        await wait(1_000);
        results.genericContinueIgnored = clicks('generic-continue') === 0;
        remove('generic-continue');

        // Conflicting exact Continue/Stop semantics are unknown and fail closed.
        addButton('Continue generating', 'conflicting-labels', { ariaLabel: 'Stop generating' });
        await wait(1_000);
        results.conflictingContinueStopSemanticsSuppressed = clicks('conflicting-labels') === 0;
        remove('conflicting-labels');

        // A reused stop test-id carrying Continue semantics is also treated as unknown.
        addButton('Continue generating', 'stop-testid-continue', { testId: 'stop-button' });
        await wait(1_000);
        results.stopTestIdContinueOverlapSuppressed = clicks('stop-testid-continue') === 0 && status().manualStopSuppressed === false;
        remove('stop-testid-continue');

        // Non-empty composer directly suppresses a valid native control.
        setComposer('Owner draft still being edited');
        addButton('Continue generating', 'non-empty-composer');
        await wait(1_000);
        results.nonEmptyComposerSuppresses = clicks('non-empty-composer') === 0;
        remove('non-empty-composer');
        setComposer('');

        // Multiple visible composers fail closed.
        const secondComposer = document.createElement('div');
        secondComposer.id = 'prompt-textarea';
        secondComposer.contentEditable = 'true';
        secondComposer.style.minHeight = '24px';
        document.getElementById('composer-form').append(secondComposer);
        addButton('Continue generating', 'ambiguous-composer');
        await wait(1_000);
        results.multipleVisibleComposersSuppressed = clicks('ambiguous-composer') === 0;
        secondComposer.remove();
        remove('ambiguous-composer');

        // Hidden-only composer fails closed.
        const primaryComposer = document.querySelector('#prompt-textarea');
        primaryComposer.classList.add('hidden');
        addButton('Continue generating', 'hidden-composer');
        await wait(1_000);
        results.hiddenOnlyComposerSuppressed = clicks('hidden-composer') === 0;
        remove('hidden-composer');
        primaryComposer.classList.remove('hidden');

        // A hidden stale duplicate plus one visible composer is still ambiguous and fails closed.
        const staleComposer = document.createElement('div');
        staleComposer.id = 'prompt-textarea';
        staleComposer.contentEditable = 'true';
        staleComposer.className = 'hidden';
        document.getElementById('composer-form').append(staleComposer);
        addButton('Continue generating', 'hidden-visible-duplicate');
        await wait(1_000);
        results.hiddenVisibleDuplicateComposerSuppressed = clicks('hidden-visible-duplicate') === 0 && status().composer.known === false && status().composer.candidateCount === 2;
        staleComposer.remove();
        remove('hidden-visible-duplicate');

        // Submission intent must suppress stale native controls even after composer clearing.
        const countBeforeIntent = status().chainCount;
        setComposer('Owner draft');
        addButton('Continue generating', 'stale-during-submit');
        document.querySelector('[data-testid="send-button"]').click();
        setComposer('');
        await wait(1_050);
        results.pendingSubmissionSuppressesAutoClick = clicks('stale-during-submit') === 0 && status().submissionIntent !== null;
        results.composerClearDoesNotConfirmSubmission = status().chainCount === countBeforeIntent;

        // A new stable user-message identity in the same conversation confirms and resets,
        // while the stale continuation control remains consumed and never clicks afterward.
        addUserMessage(2, 'Owner draft');
        await wait(1_050);
        results.sameChatUserMessageConfirmsReset = status().chainCount === 0 && status().submissionIntent === null;
        results.confirmationDoesNotReuseStaleControl = clicks('stale-during-submit') === 0 && document.getElementById('stale-during-submit').getAttribute(CLICKED_ATTRIBUTE) === '1';
        remove('stale-during-submit');

        // Seed chat B runtime; A intent followed by navigation must not mutate B.
        sessionStorage.setItem(runtimeKey('chat-b'), JSON.stringify({ chainCount: 5, manualStopSuppressed: true }));
        setComposer('Another owner draft');
        document.querySelector('[data-testid="send-button"]').click();
        history.pushState({}, '', '/c/chat-b');
        await wait(250);
        results.crossChatIntentCancelled = status().conversationId === 'chat-b' && status().chainCount === 5 && status().manualStopSuppressed === true && status().submissionIntent === null;

        // SPA transition must consume stale Continue DOM before loading destination state.
        setComposer('');
        history.pushState({}, '', '/c/spa-a');
        localStorage.setItem(enabledKey('spa-a'), '1');
        sessionStorage.setItem(runtimeKey('spa-a'), JSON.stringify({ chainCount: 0, manualStopSuppressed: false }));
        await loadController();
        addButton('Continue generating', 'spa-stale-a');
        localStorage.setItem(enabledKey('spa-b'), '1');
        sessionStorage.setItem(runtimeKey('spa-b'), JSON.stringify({ chainCount: 0, manualStopSuppressed: false }));
        history.pushState({}, '', '/c/spa-b');
        await wait(1_100);
        results.spaTransitionConsumesStaleControl = status().conversationId === 'spa-b' && status().enabled === true && status().chainCount === 0 && clicks('spa-stale-a') === 0 && document.getElementById('spa-stale-a').getAttribute(CLICKED_ATTRIBUTE) === '1';
        remove('spa-stale-a');
        addButton('Continue generating', 'spa-fresh-b');
        await wait(1_050);
        results.spaTransitionFreshControlStillWorks = clicks('spa-fresh-b') === 1 && status().chainCount === 1;
        remove('spa-fresh-b');

        // New-chat/non-conversation routes cannot enable or carry state.
        history.pushState({}, '', '/');
        await wait(150);
        window[CONTROLLER_KEY].enable();
        const newChatStatus = status();
        history.pushState({}, '', '/c/chat-c');
        await wait(200);
        results.newChatCannotEnableOrCarry = newChatStatus.enabled === false && document.getElementById('deviltea-chatgpt-native-auto-continue-toggle').disabled === false && status().enabled === false;
        // The current toggle is enabled again on chat-c; verify the captured new-chat status separately.
        results.newChatCannotEnableOrCarry = results.newChatCannotEnableOrCarry && newChatStatus.conversationId === null;

        // Enable chat C and verify exact-label manual Stop fallback suppresses auto continuation.
        window[CONTROLLER_KEY].enable();
        addButton('Stop generating', 'semantic-stop');
        document.getElementById('semantic-stop').click();
        remove('semantic-stop');
        addButton('Continue generating', 'after-stop');
        await wait(1_000);
        results.semanticStopSuppresses = status().manualStopSuppressed === true && clicks('after-stop') === 0;
        document.getElementById('after-stop').click();
        await wait(150);
        results.manualContinueClearsStop = status().manualStopSuppressed === false && clicks('after-stop') === 1;
        remove('after-stop');

        // Chain limit is loaded from session state and cannot be auto-bypassed by re-evaluation.
        sessionStorage.setItem(runtimeKey('chat-c'), JSON.stringify({ chainCount: 8, manualStopSuppressed: false }));
        await loadController();
        addButton('Continue generating', 'at-limit');
        await wait(1_000);
        results.persistedChainLimitSuppresses = status().chainCount === 8 && clicks('at-limit') === 0;
        remove('at-limit');

        // Runtime storage write failure must fail closed before clicking a new control.
        history.pushState({}, '', '/c/chat-d');
        localStorage.setItem(enabledKey('chat-d'), '1');
        sessionStorage.setItem(runtimeKey('chat-d'), JSON.stringify({ chainCount: 0, manualStopSuppressed: false }));
        setComposer('');
        await loadController();
        const originalSetItem = Storage.prototype.setItem;
        Storage.prototype.setItem = function (key, value) {
          if (this === window.sessionStorage && String(key).startsWith(RUNTIME_PREFIX)) {
            throw new Error('synthetic runtime storage failure');
          }
          return originalSetItem.call(this, key, value);
        };
        addButton('Continue generating', 'storage-failure');
        await wait(1_000);
        results.runtimeStorageFailureFailsClosed = status().persistenceHealthy === false && status().enabled === false && clicks('storage-failure') === 0;
        Storage.prototype.setItem = originalSetItem;
        remove('storage-failure');

        // A page-lifetime persistence failure survives userscript re-evaluation even after storage recovers.
        await loadController();
        results.persistenceFailureSurvivesReEvaluation = status().persistenceHealthy === false && status().enabled === false;

        // Simulate a fresh page lifetime and verify runtime read failure also fails closed.
        window[CONTROLLER_KEY].destroy();
        delete window.__devilteaChatGPTNativeAutoContinuePersistenceFailed;
        history.pushState({}, '', '/c/chat-e');
        localStorage.setItem(enabledKey('chat-e'), '1');
        sessionStorage.setItem(runtimeKey('chat-e'), JSON.stringify({ chainCount: 4, manualStopSuppressed: false }));
        const originalGetItem = Storage.prototype.getItem;
        Storage.prototype.getItem = function (key) {
          if (this === window.sessionStorage && String(key).startsWith(RUNTIME_PREFIX)) {
            throw new Error('synthetic runtime read failure');
          }
          return originalGetItem.call(this, key);
        };
        await loadController();
        results.runtimeStorageReadFailureFailsClosed = status().persistenceHealthy === false && status().enabled === false;
        Storage.prototype.getItem = originalGetItem;

        // Cleanup must not overwrite a third-party history wrapper installed after this controller.
        window[CONTROLLER_KEY].destroy();
        delete window.__devilteaChatGPTNativeAutoContinuePersistenceFailed;
        history.pushState = fixtureNativePushState;
        history.replaceState({}, '', '/c/chat-f');
        await loadController();
        let thirdPartyPushCalls = 0;
        const wrappedByController = history.pushState;
        function thirdPartyPushState(...args) {
          thirdPartyPushCalls += 1;
          return wrappedByController.apply(this, args);
        }
        history.pushState = thirdPartyPushState;
        await loadController();
        window[CONTROLLER_KEY].destroy();
        const wrapperPreserved = history.pushState === thirdPartyPushState;
        history.pushState({}, '', '/c/chat-f');
        results.historyCleanupPreservesThirdPartyWrapper = wrapperPreserved && thirdPartyPushCalls === 1;
        history.pushState = fixtureNativePushState;
        await loadController();

        const failed = Object.entries(results).filter(([, passed]) => !passed).map(([name]) => name);
        const report = { passed: failed.length === 0, results, failed, finalStatus: status() };
        resultNode.textContent = JSON.stringify(report, null, 2);
        resultNode.dataset.passed = String(report.passed);
        window.__acceptanceResult = report;
      } catch (error) {
        const report = { passed: false, error: String(error?.stack || error) };
        resultNode.textContent = JSON.stringify(report, null, 2);
        resultNode.dataset.passed = 'false';
        window.__acceptanceResult = report;
      }
    })();
  </script>
</body>
</html>
