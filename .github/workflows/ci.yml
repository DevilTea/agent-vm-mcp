name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            config/playwright-mcp/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir config/playwright-mcp install --frozen-lockfile --ignore-scripts

      - name: Enforce removed runtime residue policy
        shell: bash
        run: |
          set -euo pipefail
          removed_runtime='h''erdr'
          if git grep -n -i "$removed_runtime" -- .; then
            echo "::error::Removed runtime residue detected in tracked repository content."
            exit 1
          fi

      - name: Run portable test suite
        run: pnpm test
